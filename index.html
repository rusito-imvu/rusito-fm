<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d24">
<title>FM REBELDES — Radio Online</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080615;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden;padding:0 0 32px}
.page{width:100%;max-width:700px;margin:0 auto}
.hero{width:100%;display:block;line-height:0;background:#080615}
.hero img{display:block;width:100%;height:auto;object-fit:contain}
.radio{width:100%;padding:18px 20px 26px;text-align:center;background:linear-gradient(180deg,#100b24 0%,#0b0718 100%);border:1px solid #b66cff70;border-top:0;border-radius:0 0 25px 25px;box-shadow:0 0 35px #a32aff35}
audio{display:none}
.custom-player{display:flex;align-items:center;gap:13px;width:100%;margin:0 auto;padding:14px 15px;border-radius:18px;background:linear-gradient(135deg,#17102f,#241044);border:1px solid #9e55ff99;box-shadow:0 0 18px #8e35ff35,inset 0 0 18px #00d9ff12}
.play-btn{flex:0 0 52px;width:52px;height:52px;border-radius:50%;border:2px solid #00dcff;color:#fff;background:linear-gradient(145deg,#8d24ff,#35106e);box-shadow:0 0 14px #00dcff88,0 0 22px #a42cff66;font-size:20px;cursor:pointer}
.player-info{flex:1;min-width:0;text-align:left}
.player-title{font-size:13px;font-weight:bold;letter-spacing:1.2px;color:#fff}
.player-title span{display:block;margin-top:5px;font-size:10px;letter-spacing:2px;color:#ff719e}
.player-hint{margin-top:5px;font-size:11px;color:#c9a8ff}
.volume-wrap{display:flex;align-items:center;gap:7px;color:#00dcff}
.volume-wrap input{width:66px;accent-color:#c04cff}
.song{margin-top:15px;padding:17px;border-radius:15px;background:#ffffff12;border:1px solid #ffffff20}
.song-label{font-size:11px;letter-spacing:3px;color:#d4a8ff;margin-bottom:10px}
#song{font-size:16px;font-weight:bold;overflow-wrap:anywhere}
.equalizer{height:88px;display:flex;align-items:flex-end;justify-content:center;gap:5px;margin:14px 0 4px;padding:0 2px 3px;overflow:hidden}
.bar{flex:1 1 0;width:7px;max-width:12px;height:3px;min-height:3px;border-radius:999px;background:linear-gradient(to top,#087dff,#35eaff);box-shadow:0 0 8px #00cfff99,0 0 15px #00cfff44;transition:height .07s linear,background .16s linear,box-shadow .16s linear;will-change:height,background;transform-origin:bottom}
#status{font-size:13px;color:#d4a8ff;margin-top:10px}
@media(max-width:480px){.radio{padding:15px 13px 22px}.custom-player{gap:10px;padding:12px 11px}.play-btn{flex-basis:48px;width:48px;height:48px}.player-title{font-size:12px}.volume-wrap input{width:58px}.equalizer{gap:4px;height:78px}.bar{width:auto;max-width:9px}}
</style>
</head>

 <main class="radio">
  <audio id="player" preload="none" crossorigin="anonymous" src="https://rusito-fm-ahora-suena.rusorau21.workers.dev/radio.mp3"></audio>
  <!-- 1. Reproductor inmediatamente debajo de la foto -->
  <div class="custom-player">
   <button id="playBtn" class="play-btn" type="button" aria-label="Reproducir">▶</button>
   <div class="player-info">
    <div class="player-title">FM REBELDES <span>● EN VIVO</span></div>
    <div class="player-hint" id="playerHint">Tocá para escuchar</div>
   </div>
   <div class="volume-wrap"><span>♫</span><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volumen"></div>
  </div>
  <!-- 2. Canción que está sonando -->
  <div class="song"><div class="song-label">🎵 AHORA SUENA</div><div id="song">Buscando canción...</div></div>
  <!-- 3. Vúmetro debajo de la canción -->
  <div class="equalizer" id="equalizer" aria-label="Vúmetro animado"></div>
  <div id="status">Tocá reproducir para escuchar en vivo</div>
 </main>
</div>
<script>
const audio = document.getElementById("player");
const status = document.getElementById("status");
const playBtn = document.getElementById("playBtn");
const playerHint = document.getElementById("playerHint");
const volume = document.getElementById("volume");
const song = document.getElementById("song");
const eq = document.getElementById("equalizer");

const STREAM_URL = "https://rusito-fm-ahora-suena.rusorau21.workers.dev/radio.mp3";

audio.volume = Number(volume.value);
volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

// Estado de reproducción y reconexión
let userWantsPlayback = false;
let reconnectTimer = null;
let reconnectDelay = 2000;
let lastProgress = Date.now();
let waitingSince = 0;
let reconnecting = false;

function updatePlayerUI(playing) {
  playBtn.textContent = playing ? "Ⅱ" : "▶";
  playBtn.setAttribute("aria-label", playing ? "Pausar" : "Reproducir");
  playerHint.textContent = playing ? "Reproduciendo en vivo" : "Tocá para escuchar";
}

async function startPlayback(isReconnect = false) {
  try {
    if (isReconnect) {
      audio.src = STREAM_URL + "?r=" + Date.now();
      audio.load();
    }
    await audio.play();
    userWantsPlayback = true;
    return true;
  } catch (error) {
    // Si el navegador bloquea el autoplay, necesita el primer toque del usuario.
    if (error && error.name === "NotAllowedError") {
      userWantsPlayback = false;
      reconnecting = false;
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
      status.textContent = "Tocá reproducir para escuchar en vivo";
      updatePlayerUI(false);
      return false;
    }

    if (userWantsPlayback) scheduleReconnect();
    return false;
  }
}

playBtn.addEventListener("click", async () => {
  if (userWantsPlayback && !audio.paused) {
    userWantsPlayback = false;
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
    audio.pause();
    updatePlayerUI(false);
    status.textContent = "Radio pausada";
    return;
  }

  userWantsPlayback = true;
  reconnectDelay = 2000;
  status.textContent = "Conectando con FM REBELDES...";
  await startPlayback();
});

audio.addEventListener("pause", () => {
  stopVisualizer();
  if (!userWantsPlayback) updatePlayerUI(false);
});

audio.addEventListener("playing", () => {
  reconnecting = false;
  clearTimeout(reconnectTimer);
  reconnectTimer = null;
  reconnectDelay = 2000;
  lastProgress = Date.now();
  waitingSince = 0;
  status.textContent = "¡Estás escuchando FM REBELDES!";
  updatePlayerUI(true);
  startVisualizer();
});

audio.addEventListener("timeupdate", () => {
  lastProgress = Date.now();
});

audio.addEventListener("waiting", () => {
  if (!userWantsPlayback) return;
  if (!waitingSince) waitingSince = Date.now();
  status.textContent = "Recuperando señal...";
});

audio.addEventListener("stalled", () => {
  if (userWantsPlayback) scheduleReconnect();
});

audio.addEventListener("error", () => {
  if (userWantsPlayback) scheduleReconnect();
});

function scheduleReconnect() {
  if (!userWantsPlayback || reconnectTimer) return;

  reconnecting = true;
  status.textContent = "Se perdió la señal. Reconectando...";
  playerHint.textContent = "Reconectando automáticamente";

  reconnectTimer = setTimeout(async () => {
    reconnectTimer = null;
    if (!userWantsPlayback) {
      reconnecting = false;
      return;
    }

    const connected = await startPlayback(true);
    if (!connected && userWantsPlayback && !reconnectTimer) {
      reconnectDelay = Math.min(reconnectDelay * 1.7, 15000);
      scheduleReconnect();
    }
  }, reconnectDelay);
}

// Detecta cortes donde el navegador no dispara un evento de error.
setInterval(() => {
  if (!userWantsPlayback || audio.paused) return;

  const noProgress = Date.now() - lastProgress > 18000;
  const waitingTooLong = waitingSince && Date.now() - waitingSince > 12000;

  if (noProgress || waitingTooLong) {
    scheduleReconnect();
  }
}, 4000);

// Vúmetro real: 28 bandas repartidas por frecuencia, con refuerzo suave de agudos.
const bars = [];
let audioContext = null;
let analyser = null;
let frequencyData = null;
let visualizerFrame = null;
let sourceNode = null;
let smoothedLevels = Array(28).fill(0);

for (let i = 0; i < 28; i++) {
  const bar = document.createElement("div");
  bar.className = "bar";
  eq.appendChild(bar);
  bars.push(bar);
}

function startVisualizer() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error("AudioContext no disponible");

    if (!audioContext) {
      audioContext = new AudioContextClass();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.68;
      analyser.minDecibels = -88;
      analyser.maxDecibels = -12;
      frequencyData = new Uint8Array(analyser.frequencyBinCount);
      sourceNode = audioContext.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") audioContext.resume();
    if (visualizerFrame) cancelAnimationFrame(visualizerFrame);

    const draw = () => {
      analyser.getByteFrequencyData(frequencyData);
      // Margen superior para que ninguna barra se corte en móviles.
      const maxHeight = Math.max(24, eq.clientHeight - 12);
      const nyquist = audioContext.sampleRate / 2;
      const minHz = 45;
      const maxHz = Math.min(17000, nyquist);

      bars.forEach((bar, index) => {
        // Bandas logarítmicas: todas las barras reciben frecuencias útiles.
        const lowHz = minHz * Math.pow(maxHz / minHz, index / bars.length);
        const highHz = minHz * Math.pow(maxHz / minHz, (index + 1) / bars.length);
        const firstBin = Math.max(1, Math.floor(lowHz / nyquist * frequencyData.length));
        const lastBin = Math.min(frequencyData.length - 1,
          Math.max(firstBin + 1, Math.ceil(highHz / nyquist * frequencyData.length)));

        let sum = 0;
        let peak = 0;
        let count = 0;
        for (let bin = firstBin; bin <= lastBin; bin++) {
          const value = frequencyData[bin] / 255;
          sum += value;
          if (value > peak) peak = value;
          count++;
        }

        const average = count ? sum / count : 0;
        const isTreble = lowHz >= 2200;
        const trebleBoost = isTreble ? 1.55 : (lowHz >= 900 ? 1.18 : 1.0);
        const raw = Math.min(1, (average * 0.72 + peak * 0.68) * trebleBoost);
        const amplified = Math.pow(raw, 0.72);

        // Ataque rápido y caída suave: sigue el ritmo sin temblar demasiado.
        const previous = smoothedLevels[index];
        const smoothing = amplified > previous ? 0.62 : 0.14;
        const level = previous + (amplified - previous) * smoothing;
        smoothedLevels[index] = level;

        const height = 3 + level * maxHeight;
        const glow = 5 + level * 16;
        const glowAlpha = 0.28 + level * 0.58;

        bar.style.height = height.toFixed(1) + "px";
        // El color queda ordenado verticalmente en TODAS las barras:
        // azul/cian abajo, violeta/fucsia al medio y naranja/rojo arriba.
        bar.style.background =
          "linear-gradient(to top, #087dff 0%, #19dcff 22%, #713cff 43%, #ed28d8 63%, #ff4b72 81%, #ff9a18 100%)";
        bar.style.boxShadow =
          `0 0 ${glow}px rgba(0,220,255,${glowAlpha}), 0 0 ${glow * 1.5}px rgba(239,35,214,${glowAlpha * 0.62})`;
      });

      visualizerFrame = requestAnimationFrame(draw);
    };

    draw();
  } catch (error) {
    console.warn("No se pudo iniciar el vúmetro:", error);
    status.textContent = "Audio en vivo (visualizador no disponible)";
  }
}
function stopVisualizer() {
  if (visualizerFrame) {
    cancelAnimationFrame(visualizerFrame);
    visualizerFrame = null;
  }
  bars.forEach(bar => bar.style.height = "3px");
  smoothedLevels.fill(0);
}

// Intenta iniciar automáticamente al abrir la página.
// Si el navegador bloquea el audio automático, queda disponible el botón Play.
window.addEventListener("load", () => {
  status.textContent = "Intentando iniciar FM REBELDES...";
  startPlayback();
});

// Información de la canción
async function updateSong() {
  try {
    const response = await fetch(
      "https://rusito-fm-ahora-suena.rusorau21.workers.dev/",
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("Sin respuesta");
    const data = await response.json();
    song.textContent = data.title || "Sin información";
  } catch (error) {
    song.textContent = "Esperando información...";
  }
}

updateSong();
setInterval(updateSong, 5000);
</script>
