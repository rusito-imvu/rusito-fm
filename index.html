<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUSITO FM — Radio Online</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;
 background:radial-gradient(circle at top,#38205d,#100d1c 65%);
 color:white;font-family:Arial,sans-serif
}
.radio{
 width:100%;max-width:430px;text-align:center;padding:35px 25px;
 border:1px solid #ffffff25;border-radius:28px;
 background:#ffffff0c;box-shadow:0 20px 70px #0008
}
.logo{font-size:65px}
h1{font-size:34px;letter-spacing:3px;margin:5px 0}
.sub{color:#c4a9e9;letter-spacing:4px;font-size:12px}
.line{height:1px;background:#ffffff25;margin:28px 0}
.live{color:#ff668d;font-size:13px;letter-spacing:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;
 background:#ff668d;margin-right:8px}
audio{width:100%;margin-top:25px}
#status{font-size:13px;color:#c4a9e9;margin-top:15px}
.footer{font-size:11px;color:#8e83a3;margin-top:30px;letter-spacing:2px}
</style>
</head>
<body>
<div class="radio">
 <div class="logo">📻</div>
 <h1>RUSITO FM</h1>
 <div class="sub">TU RADIO · TU MÚSICA</div>
 <div class="line"></div>
 <div class="live"><span class="dot"></span>TRANSMISIÓN ONLINE</div>

 <audio id="player" controls preload="none"
 src="https://golden-pine-2c7c492e.tunnl.gg/radio.mp3">
 </audio>

 <div id="nowplaying" style="margin-top:22px;padding:15px;border-radius:15px;background:#ffffff10">
  <div style="font-size:11px;letter-spacing:3px;color:#c4a9e9;margin-bottom:9px">🎵 AHORA SUENA</div>
  <div id="song" style="font-size:17px;font-weight:bold">Buscando canción...</div>
 </div>

 <div id="status">Tocá reproducir para escuchar en vivo</div>
 <div class="footer">RUSITO FM · HECHA CON MÚSICA ❤️</div>
</div>

<script>
const audio=document.getElementById("player");
const status=document.getElementById("status");
let lastProgress=Date.now();
let reconnecting=false;

audio.addEventListener("playing",()=>{
 status.textContent="¡Estás escuchando RUSITO FM!";
 lastProgress=Date.now();
 reconnecting=false;
});

audio.addEventListener("timeupdate",()=>{
 lastProgress=Date.now();
});

function reconnect(){
 if(reconnecting)return;
 reconnecting=true;
 status.textContent="Reconectando con RUSITO FM...";
 setTimeout(()=>{
   audio.src="https://golden-pine-2c7c492e.tunnl.gg/radio.mp3?r="+Date.now();
   audio.load();
   audio.play().catch(()=>{
     status.textContent="Conexión interrumpida. Tocá reproducir.";
     reconnecting=false;
   });
 },2000);
}

audio.addEventListener("error",()=>{
 reconnecting=false;
 reconnect();
});

setInterval(()=>{
 if(!audio.paused && Date.now()-lastProgress>20000){
   reconnecting=false;
   reconnect();
 }
},5000);

async function updateSong(){
 try{
   const response=await fetch("https://golden-pine-2c7c492e.tunnl.gg/nowplaying.json?t="+Date.now(),{cache:"no-store"});
   if(!response.ok)throw new Error("Sin respuesta");
   const data=await response.json();
   document.getElementById("song").textContent=data.title || "Sin información";
 }catch(e){
   document.getElementById("song").textContent="Esperando información...";
 }
}
updateSong();
setInterval(updateSong,5000);

</script>
</body>
</html>
